<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleship</title>
<style>
  :root {
    --deep:    #061320;
    --hull-bg: #0d1d2c;
    --panel:   #112536;
    --line:    #23445f;
    --ink:     #e9f3fb;
    --dim:     #91adc6;
    --teal:    #3ad4c8;
    --amber:   #f5b73d;
    --red:     #ef4c4c;
    --brass:   #c9a227;
    --sea-1:   #12384f;
    --sea-2:   #0d2a3d;
    --steel-1: #8ea4b5;
    --steel-2: #5d7387;
    --steel-3: #3d5062;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 1.75rem 1rem 4rem;
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #123047 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 10%, #0f2c40 0%, transparent 55%),
      var(--deep);
    min-height: 100vh;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- header ---------- */

  header { display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; align-items: center; margin-bottom: 1.4rem; }

  /* Hull lettering: stencilled, painted on steel. The bridges across the
     letterforms are a mask, so the page shows through them the way a real
     stencil leaves gaps. */
  .wordmark { margin: 0; display: flex; align-items: center; gap: .55rem; }

  .stencil {
    font: 400 1.95rem/1 Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: transparent;
    background: linear-gradient(180deg, #ffffff 0%, #d9e6f0 26%, #aabecd 54%, #7d93a6 82%, #9db1c2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    /* Two bridges, placed by percentage so they land inside the cap height
       rather than clipping the baseline. */
    -webkit-mask-image: linear-gradient(180deg,
      #000 0 33%, transparent 33% 38%, #000 38% 63%, transparent 63% 68%, #000 68% 100%);
    mask-image: linear-gradient(180deg,
      #000 0 33%, transparent 33% 38%, #000 38% 63%, transparent 63% 68%, #000 68% 100%);
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.95)) drop-shadow(0 4px 9px rgba(0,0,0,.6));
  }
  .stencil i {
    font-style: normal;
    color: transparent;
    background: linear-gradient(180deg, #b6fdf5 0%, #4fdcce 42%, #16a99d 82%, #3fc9bd 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* Without clip-to-text the letters would be transparent, i.e. invisible.
     Fall back to flat colour rather than no title at all. */
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .stencil { background: none; color: var(--ink); -webkit-mask-image: none; mask-image: none; }
    .stencil i { background: none; color: var(--teal); }
  }

  .code-plate {
    display: flex; align-items: center; gap: .5rem;
    font: 700 1rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .22em;
    color: #ffe9a8;
    background: linear-gradient(180deg, #2a2417, #1a1710);
    border: 1px solid #574a24; border-radius: .35rem;
    padding: .45rem .8rem .45rem .7rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 6px rgba(0,0,0,.4);
  }
  .code-plate::before {
    content: ''; width: .5rem; height: .5rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--brass));
    box-shadow: 0 0 6px rgba(201,162,39,.8);
  }

  .conn { margin-left: auto; font-size: .82rem; color: var(--dim); display: flex; align-items: center; gap: .45rem; }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px currentColor; color: var(--red); }
  .dot.on { background: var(--teal); color: var(--teal); }

  /* ---------- status ---------- */

  .status {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel), #0d1e2d);
    border: 1px solid var(--line); border-radius: .5rem;
    padding: .85rem 1.1rem .85rem 1.3rem; margin-bottom: 1.1rem; min-height: 3.4rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 6px 18px rgba(0,0,0,.35);
  }
  .status::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--teal); }
  .status.alert::before { background: var(--amber); }
  .status.bad::before { background: var(--red); }
  .status.hot::before { background: var(--red); box-shadow: 0 0 14px var(--red); }
  .status b { color: var(--teal); }
  .status.hot b { color: #ff9b8a; }
  .status .sub { display: block; color: var(--dim); font-size: .85rem; margin-top: .1rem; }

  /* ---------- controls ---------- */

  .controls { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.4rem; }
  button {
    font: 600 .9rem/1 inherit; color: var(--ink); cursor: pointer;
    background: linear-gradient(180deg, #1d354a, #142636);
    border: 1px solid var(--line); border-radius: .4rem; padding: .68rem 1.15rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 5px rgba(0,0,0,.35);
    transition: border-color .15s, transform .06s;
  }
  button:hover:not(:disabled) { border-color: var(--teal); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, #46e2d5, #21b3a7);
    color: #04262b; border-color: #2fd0c2; text-shadow: 0 1px 0 rgba(255,255,255,.25);
  }
  button:disabled { opacity: .42; cursor: not-allowed; }

  input {
    font: 700 1rem/1 ui-monospace, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); background: #0b1a27; border: 1px solid var(--line);
    padding: .62rem .7rem; border-radius: .4rem; width: 8rem; text-align: center;
  }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  /* ---------- boards ---------- */

  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1.6rem; }

  .board-case {
    background: linear-gradient(180deg, #16293a, #0d1c29);
    border: 1px solid var(--line); border-radius: .7rem; padding: .9rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 26px rgba(0,0,0,.45);
  }
  .board-case h2 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .16em;
    color: var(--dim); margin: 0 0 .7rem; display: flex; align-items: center; gap: .5rem;
  }
  .board-case h2::before {
    content: ''; width: .45rem; height: .45rem; border-radius: 50%; background: var(--line);
  }
  .board-case.live h2::before { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .board-case.live { border-color: #2c6a72; }

  /* Labels sit in the same grid as the cells; the ship and water layers are
     absolutely positioned over the cell region only, using these two sizes. */
  .grid {
    --lab-w: 1.5rem;
    --lab-h: 1.15rem;
    position: relative;
    display: grid;
    grid-template-columns: var(--lab-w) repeat(10, 1fr);
    gap: 0;
  }
  .lab {
    font: 600 .62rem/1 ui-monospace, Menlo, monospace; color: var(--dim);
    display: flex; align-items: center; justify-content: center; height: var(--lab-h);
  }
  .lab.row { height: auto; }

  .layer { position: absolute; left: var(--lab-w); top: var(--lab-h); right: 0; bottom: 0; pointer-events: none; }
  .water {
    z-index: 0; border-radius: 3px; overflow: hidden;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, var(--sea-1), var(--sea-2));
  }
  .water::after {
    content: ''; position: absolute; inset: -40%;
    background: radial-gradient(closest-side, rgba(90,190,220,.14), transparent 70%);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-14%, -8%) scale(1); }
    to   { transform: translate(16%, 10%) scale(1.15); }
  }
  .ships { z-index: 1; }

  .cell {
    position: relative; z-index: 2;
    aspect-ratio: 1; background: transparent;
    border: 1px solid rgba(140, 195, 220, .10);
  }
  /* Cells paint above the hulls so pegs read on top, which also means they'd
     swallow the pointer. Your own board is never clicked, so let events fall
     through to the hulls underneath and make them draggable. */
  #ownGrid .cell { pointer-events: none; }

  .cell.aim { cursor: crosshair; }
  .cell.aim:hover { background: rgba(58, 212, 200, .16); box-shadow: inset 0 0 0 1px var(--teal); }

  /* Peg holes, as on the physical board — including through the hulls, which is
     exactly where the red pegs go. */
  .cell::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 24%; height: 24%; transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(0, 0, 0, .30);
    box-shadow: inset 0 1px 1.5px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.05);
  }

  /* Pegs — red domes for hits, ivory for misses. */
  .cell.hit::after, .cell.miss::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 54%; height: 54%; transform: translate(-50%, -50%); border-radius: 50%;
  }
  .cell.hit::after {
    background: radial-gradient(circle at 34% 26%, #ff9e8e, #e8352f 52%, #7e1010);
    box-shadow: 0 2px 4px rgba(0,0,0,.65), 0 0 12px rgba(239,76,76,.5);
  }
  .cell.miss::after {
    width: 40%; height: 40%;
    background: radial-gradient(circle at 34% 26%, #f4f8fb, #c2d0da 55%, #6f8496);
    box-shadow: 0 1px 3px rgba(0,0,0,.6);
    opacity: .82;
  }
  .cell.last::after { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(0); }
    70%  { transform: translate(-50%, -50%) scale(1.35); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* Hulls: one element per ship, spanning its cells. The transparent border
     insets the hull so the grid lines still frame it, while the element itself
     stays exactly aligned to the cells it occupies. */
  .hull {
    position: absolute;
    border: 3px solid transparent;
    background: linear-gradient(180deg, var(--steel-1) 0%, var(--steel-2) 46%, var(--steel-3) 100%);
    background-clip: padding-box;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.55);
  }
  .hull.h { border-radius: 46% 8px 8px 46% / 50% 10px 10px 50%; }
  .hull.v { border-radius: 46% 46% 8px 8px / 50% 50% 10px 10px; }
  /* Deck line */
  .hull::before {
    content: ''; position: absolute; inset: 26% 12%;
    background: rgba(255,255,255,.16); border-radius: 2px;
  }
  .hull.v::before { inset: 12% 26%; }
  /* Superstructure */
  .hull::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 26%; height: 46%; transform: translate(-50%, -50%);
    background: linear-gradient(180deg, #b8c8d5, #6d8294);
    border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .hull.v::after { width: 46%; height: 26%; }
  /* The ship layer ignores pointers; individual hulls opt back in while you
     are still arranging your fleet. */
  .hull.draggable { pointer-events: auto; cursor: grab; touch-action: none; }
  .hull.draggable:hover { filter: brightness(1.12); }
  .hull.dragging { cursor: grabbing; z-index: 4; filter: brightness(1.2); box-shadow: 0 10px 22px rgba(0,0,0,.6); }
  .hull.invalid { background: linear-gradient(180deg, #d17878, #7c3535); }
  .hull.sunk {
    background: linear-gradient(180deg, #6b4a4a 0%, #4a2f33 50%, #2c1c20 100%);
    filter: saturate(.55) brightness(.8);
  }
  .hull.ghost { opacity: .55; }

  /* ---------- fleet legend ---------- */

  .fleet { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .85rem; }
  .chip {
    display: flex; align-items: center; gap: .4rem;
    font: 600 .68rem/1 inherit; color: var(--dim);
    border: 1px solid var(--line); border-radius: 1rem; padding: .25rem .6rem .25rem .45rem;
    background: rgba(255,255,255,.02);
  }
  .chip .silhouette {
    display: block; height: .42rem; border-radius: .25rem;
    background: linear-gradient(180deg, var(--steel-1), var(--steel-3));
  }
  .chip.sunk { color: #ff9b8a; border-color: #6e3030; background: rgba(239,76,76,.08); }
  .chip.sunk .silhouette { background: linear-gradient(180deg, #7c5252, #3a2226); }
  .chip.sunk .name { text-decoration: line-through; }

  /* ---------- impact effects ---------- */

  .fx {
    position: absolute; left: 50%; top: 50%;
    width: 190%; height: 190%;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5;
  }
  .fx > * { position: absolute; inset: 0; border-radius: 50%; }

  .fx .core {
    background: radial-gradient(circle, #fff 0%, #ffe27a 22%, #ff9a2e 46%, #e8352f 66%, rgba(140,20,10,0) 74%);
    animation: boom-core .5s ease-out forwards;
  }
  @keyframes boom-core {
    0%   { transform: scale(.12); opacity: 1; }
    45%  { transform: scale(.85); opacity: 1; }
    100% { transform: scale(1.12); opacity: 0; }
  }

  .fx .ring {
    border: 2px solid rgba(255, 214, 140, .95);
    animation: boom-ring .6s cubic-bezier(.15,.75,.3,1) forwards;
  }
  @keyframes boom-ring {
    0%   { transform: scale(.15); opacity: 1; }
    100% { transform: scale(1.05); opacity: 0; }
  }

  .fx .smoke {
    background: radial-gradient(circle, rgba(70,70,80,.8) 0%, rgba(40,40,50,0) 68%);
    animation: boom-smoke 1.15s ease-out forwards;
  }
  @keyframes boom-smoke {
    0%   { transform: scale(.25); opacity: 0; }
    30%  { opacity: .8; }
    100% { transform: scale(1.05) translateY(-22%); opacity: 0; }
  }

  .fx .spark {
    inset: auto; left: 50%; top: 50%;
    width: 3px; height: 3px; border-radius: 2px;
    background: #ffd889; box-shadow: 0 0 7px #ffae3a;
    animation: boom-spark .62s ease-out forwards;
  }
  @keyframes boom-spark {
    0%   { transform: translate(-50%, -50%) rotate(var(--a)) translateX(2px); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--d)); opacity: 0; }
  }

  .fx .ripple {
    border: 2px solid rgba(198, 232, 246, .85);
    animation: splash-ripple .8s ease-out forwards;
  }
  .fx .ripple:nth-child(2) { animation-delay: .12s; }
  .fx .ripple:nth-child(3) { animation-delay: .26s; }
  @keyframes splash-ripple {
    0%   { transform: scale(.18); opacity: .9; }
    100% { transform: scale(.85); opacity: 0; }
  }

  .shake { animation: shake .42s ease-in-out; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  /* ---------- end-of-game modal ---------- */

  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    background: rgba(3, 10, 18, .74);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    animation: fade .28s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(430px, 100%); text-align: center;
    background: linear-gradient(180deg, #172b3d, #0b1a26);
    border: 1px solid var(--line); border-radius: .9rem;
    padding: 2.1rem 1.8rem 1.5rem;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
    animation: rise .34s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } }

  .verdict {
    font: 800 2.1rem/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase; margin: 0 0 .5rem;
  }
  .modal.win  .verdict { color: var(--teal); text-shadow: 0 0 28px rgba(58,212,200,.5); }
  .modal.lose .verdict { color: var(--red);  text-shadow: 0 0 28px rgba(239,76,76,.45); }
  .modal .line { color: var(--dim); font-size: .9rem; margin: 0 0 1.5rem; }

  .stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.6rem; }
  .stat b { display: block; font: 700 1.35rem/1.1 ui-monospace, Menlo, monospace; color: var(--ink); }
  .stat span { font-size: .64rem; text-transform: uppercase; letter-spacing: .11em; color: var(--dim); }

  .actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .note { margin: 1.1rem 0 0; font-size: .8rem; color: var(--amber); min-height: 1.1rem; }

  /* ---------- lobby ---------- */

  .lobby {
    background: linear-gradient(180deg, var(--panel), #0c1c29);
    border: 1px solid var(--line); border-radius: .7rem; padding: 2rem;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    max-width: 560px;
  }
  .lobby h2 { margin: 0 0 .4rem; font-size: 1.1rem; letter-spacing: .02em; }
  .lobby p { color: var(--dim); margin: 0 0 1.4rem; font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .or { color: var(--dim); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; margin: 0 .35rem; }

  .hidden { display: none !important; }

  @media (max-width: 420px) {
    .grid { --lab-w: 1.1rem; }
    body { padding: 1rem .6rem 3rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="wordmark"><span class="stencil">Battle<i>ship</i></span></h1>
    <span id="codeBadge" class="code-plate hidden"></span>
    <span class="conn"><span id="dot" class="dot"></span><span id="connText">offline</span></span>
  </header>

  <section id="lobby" class="lobby">
    <h2>Take command</h2>
    <p>Create a room and send the code to your opponent, or join one you were given.</p>
    <div class="row">
      <button id="createBtn" class="primary">Create a room</button>
      <span class="or">or</span>
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
      <button id="joinBtn">Join</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div id="status" class="status"></div>

    <div class="controls">
      <button id="randomBtn">Randomize fleet</button>
      <button id="readyBtn" class="primary">Ready</button>
      <button id="resultBtn" class="primary">Play again</button>
      <button id="shareBtn">Copy invite link</button>
      <button id="leaveBtn">Leave</button>
    </div>

    <div class="boards">
      <div class="board-case" id="ownCase">
        <h2>Your fleet</h2>
        <div id="ownGrid" class="grid"></div>
        <div id="ownFleet" class="fleet"></div>
      </div>
      <div class="board-case" id="enemyCase">
        <h2 id="enemyTitle">Enemy waters</h2>
        <div id="enemyGrid" class="grid"></div>
        <div id="enemyFleet" class="fleet"></div>
      </div>
    </div>
  </section>
</div>

<div id="modal" class="backdrop hidden">
  <div class="modal" id="modalBox">
    <h2 class="verdict" id="verdict">Victory</h2>
    <p class="line" id="verdictLine"></p>
    <div class="stats">
      <div class="stat"><b id="statShots">0</b><span>Shots</span></div>
      <div class="stat"><b id="statHits">0</b><span>Hits</span></div>
      <div class="stat"><b id="statAcc">0%</b><span>Accuracy</span></div>
    </div>
    <div class="actions">
      <button id="againBtn" class="primary">Play again</button>
      <button id="closeBtn">View boards</button>
    </div>
    <p class="note" id="rematchNote"></p>
  </div>
</div>

<script>
const SIZE = 10;
const COLS = Array.from({ length: SIZE }, (_, i) => String(i + 1));
const ROWS = 'ABCDEFGHIJ'.split('');
// Mirrors CODE_ALPHABET in src/game.js — no I/O/0/1, because codes get read aloud.
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const $ = (id) => document.getElementById(id);
const blank = (v) => Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => v));

// --- client state ----------------------------------------------------------
// Mirrors only what this player has legitimately been told. `tracking` is built
// purely from our own fireResult messages — the enemy layout is never here
// until gameOver fills in `reveal`.
let S = {};

function resetState(code) {
  S = {
    code,
    slot: null,
    playerId: null,
    phase: 'lobby',
    yourTurn: false,
    ready: false,
    grid: null,          // our own fleet
    ships: [],
    shot: blank(false),  // where the enemy has fired on us
    tracking: blank(null),
    enemySunk: [],
    opponent: { joined: false, present: false, ready: false },
    over: false,
    winner: null,
    reveal: null,        // enemy fleet, only after gameOver
    lastOwn: null,
    lastEnemy: null,
    // Set only while a hit is keeping someone's turn alive, so the banner can
    // explain why the turn hasn't changed hands.
    streak: null,
    theirStreak: null,
    rematchAsked: false,
    rematchOffered: false,
    error: null,
  };
}

// --- connection ------------------------------------------------------------

let ws = null;
let retry = 0;
let keepalive = null;
let leaving = false;

// Per-TAB, not per-browser. localStorage is shared across tabs on one origin,
// so a second tab would read the first player's token, and the server would
// (correctly) treat it as a rejoin and hand it the same slot. sessionStorage
// keeps two tabs on one machine as two distinct players, and still survives the
// reloads and dropped sockets that rejoin exists for.
function idKey(code) { return `battleship:${code}`; }
const identity = {
  get: (code) => sessionStorage.getItem(idKey(code)),
  set: (code, id) => sessionStorage.setItem(idKey(code), id),
  clear: (code) => sessionStorage.removeItem(idKey(code)),
};

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${scheme}://${location.host}/api/room/${S.code}`);

  ws.addEventListener('open', () => {
    retry = 0;
    setConn(true);
    const saved = identity.get(S.code);
    ws.send(JSON.stringify(saved ? { type: 'hello', playerId: saved } : { type: 'hello' }));
    // The room auto-responds to this without waking, so an idle game keeps its
    // sockets alive through proxies for free.
    keepalive = setInterval(() => ws.readyState === 1 && ws.send('ping'), 30000);
  });

  ws.addEventListener('message', (event) => {
    if (event.data === 'pong') return;
    handle(JSON.parse(event.data));
    render();
  });

  ws.addEventListener('close', () => {
    setConn(false);
    clearInterval(keepalive);
    if (leaving) return;
    // Backoff, then come back with our playerId and resync.
    retry = Math.min(retry + 1, 5);
    setTimeout(connect, [400, 800, 1600, 3200, 6000][retry - 1]);
    render();
  });
}

function setConn(on) {
  $('dot').classList.toggle('on', on);
  $('connText').textContent = on ? 'connected' : 'reconnecting…';
}

function send(message) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(message));
}

// --- server messages -------------------------------------------------------

function handle(m) {
  S.error = null;

  switch (m.type) {
    case 'welcome':
      S.slot = m.slot;
      S.playerId = m.playerId;
      S.phase = m.phase;
      identity.set(S.code, m.playerId);
      break;

    case 'full':
      S.error = 'That room already has two players.';
      leaving = true;
      break;

    case 'board':
      S.grid = m.grid;
      S.ships = m.ships;
      break;

    case 'opponent':
      S.opponent = { joined: m.joined, present: m.present, ready: m.ready };
      S.phase = m.phase;
      break;

    case 'youReady':
      S.ready = m.ready;
      break;

    case 'start':
      S.phase = 'playing';
      S.yourTurn = m.yourTurn;
      break;

    case 'fireResult':
      S.tracking[m.r][m.c] = m.hit ? 'hit' : 'miss';
      S.lastEnemy = [m.r, m.c];
      S.yourTurn = m.yourTurn;
      // Only while we still hold the move — otherwise a hit from an earlier
      // turn would still be claiming credit when the turn came back around.
      S.streak = m.yourTurn ? { hit: m.hit, sunk: m.sunk, shipName: m.shipName } : null;
      if (m.sunk) S.enemySunk.push(m.shipName);
      impact($('enemyGrid'), m.r, m.c, m.hit);
      break;

    case 'incoming':
      S.shot[m.r][m.c] = true;
      S.lastOwn = [m.r, m.c];
      S.yourTurn = m.yourTurn;
      S.theirStreak = m.yourTurn ? null : { hit: m.hit, sunk: m.sunk, shipName: m.shipName };
      if (m.sunk) markOwnSunk(m.shipName);
      impact($('ownGrid'), m.r, m.c, m.hit);
      if (m.hit) shake($('ownCase'));
      break;

    case 'resync':
      S.phase = m.phase;
      S.slot = m.slot;
      S.ready = m.ready;
      S.yourTurn = m.yourTurn;
      S.grid = m.board.grid;
      S.ships = m.board.ships;
      S.shot = m.board.shot;
      S.tracking = m.tracking;
      S.opponent = m.opponent;
      S.over = m.over;
      S.winner = m.winner;
      // A rematch replays the whole world through this same message, so every
      // trace of the finished game has to be cleared here, not just merged.
      S.reveal = m.boards ? m.boards[S.slot === 'A' ? 'B' : 'A'] : null;
      S.enemySunk = S.reveal ? S.reveal.ships.filter((s) => s.sunk).map((s) => s.name) : [];
      S.streak = null;
      S.theirStreak = null;
      S.lastOwn = null;
      S.lastEnemy = null;
      S.rematchAsked = false;
      S.rematchOffered = false;
      if (!m.over) closeModal();
      break;

    case 'gameOver':
      S.over = true;
      S.phase = 'over';
      S.winner = m.winner;
      S.reveal = m.boards[S.slot === 'A' ? 'B' : 'A'];
      openModal();
      break;

    case 'rematchPending':
      S.rematchAsked = true;
      break;

    case 'rematchOffer':
      S.rematchOffered = true;
      openModal();
      break;

    case 'error':
      S.error = m.msg;
      break;
  }
}

function markOwnSunk(name) {
  const ship = S.ships.find((s) => s.name === name);
  if (ship) ship.sunk = true;
}

// --- rendering -------------------------------------------------------------

function buildGrid(host, onClick) {
  host.replaceChildren();

  // Painted under the cells; the ship layer sits between them so pegs, which
  // live on the cells, always read on top of a hull.
  const water = document.createElement('div');
  water.className = 'layer water';
  const ships = document.createElement('div');
  ships.className = 'layer ships';
  host.append(water, ships);

  host.append(label('', 'corner'));
  for (const c of COLS) host.append(label(c, 'col'));

  for (let r = 0; r < SIZE; r++) {
    host.append(label(ROWS[r], 'row'));
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (onClick) cell.addEventListener('click', () => onClick(r, c));
      host.append(cell);
    }
  }
}

function label(text, kind) {
  const el = document.createElement('div');
  el.className = `lab ${kind}`;
  el.textContent = text;
  return el;
}

const cellsOf = (host) => host.querySelectorAll('.cell');

// One element per ship, spanning its cells — so a Carrier reads as a single
// five-cell hull rather than five disconnected squares.
function drawShips(host, ships, ghost, interactive) {
  const layer = host.querySelector('.ships');
  layer.replaceChildren();
  if (!ships) return;

  ships.forEach((ship, index) => {
    const rows = ship.cells.map(([r]) => r);
    const cols = ship.cells.map(([, c]) => c);
    const horizontal = new Set(rows).size === 1;

    const el = document.createElement('div');
    el.className = `hull ${horizontal ? 'h' : 'v'}`
      + (ship.sunk ? ' sunk' : '')
      + (ghost ? ' ghost' : '')
      + (interactive ? ' draggable' : '');
    el.dataset.index = index;
    el.style.left = `${Math.min(...cols) * 10}%`;
    el.style.top = `${Math.min(...rows) * 10}%`;
    el.style.width = `${(horizontal ? ship.size : 1) * 10}%`;
    el.style.height = `${(horizontal ? 1 : ship.size) * 10}%`;
    if (interactive) {
      el.title = `${ship.name} — drag to move, click to rotate`;
      el.addEventListener('pointerdown', startDrag);
    }
    layer.append(el);
  });
}

// --- manual placement ------------------------------------------------------

let drag = null;

// The rendered ships carry their cells; this recovers the origin + orientation
// that the placement protocol speaks in.
function layoutFromShips(ships) {
  return ships.map((ship) => {
    const rows = ship.cells.map(([r]) => r);
    const cols = ship.cells.map(([, c]) => c);
    return {
      name: ship.name,
      size: ship.size,
      r: Math.min(...rows),
      c: Math.min(...cols),
      horizontal: new Set(rows).size === 1,
    };
  });
}

// A local pre-check so the drag can show red before we ask the server. The
// server re-validates regardless; this is only for feedback.
function layoutValid(layout) {
  const taken = new Set();
  for (const ship of layout) {
    for (let i = 0; i < ship.size; i++) {
      const r = ship.horizontal ? ship.r : ship.r + i;
      const c = ship.horizontal ? ship.c + i : ship.c;
      if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
      const key = `${r},${c}`;
      if (taken.has(key)) return false;
      taken.add(key);
    }
  }
  return true;
}

const clamp = (v, max) => Math.max(0, Math.min(v, max));

function startDrag(event) {
  if (S.phase !== 'placing' || S.ready) return;
  event.preventDefault();

  const el = event.currentTarget;
  const index = Number(el.dataset.index);
  const rect = $('ownGrid').querySelector('.ships').getBoundingClientRect();
  const layout = layoutFromShips(S.ships);
  const ship = layout[index];

  const pointerR = Math.floor((event.clientY - rect.top) / (rect.height / SIZE));
  const pointerC = Math.floor((event.clientX - rect.left) / (rect.width / SIZE));
  // Which cell along the hull you grabbed, so it doesn't jump under the cursor.
  const grab = ship.horizontal ? pointerC - ship.c : pointerR - ship.r;

  drag = { el, index, layout, grab, rect, moved: false, startX: event.clientX, startY: event.clientY };
  el.classList.add('dragging');
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', endDrag, { once: true });
}

function onDragMove(event) {
  if (!drag) return;
  const { rect, layout, index, grab } = drag;

  if (Math.abs(event.clientX - drag.startX) > 3 || Math.abs(event.clientY - drag.startY) > 3) {
    drag.moved = true;
  }

  const ship = layout[index];
  const pointerR = Math.floor((event.clientY - rect.top) / (rect.height / SIZE));
  const pointerC = Math.floor((event.clientX - rect.left) / (rect.width / SIZE));

  const r = clamp(ship.horizontal ? pointerR : pointerR - grab, SIZE - (ship.horizontal ? 1 : ship.size));
  const c = clamp(ship.horizontal ? pointerC - grab : pointerC, SIZE - (ship.horizontal ? ship.size : 1));

  drag.candidate = { ...ship, r, c };
  drag.ok = layoutValid(layout.map((s, i) => (i === index ? drag.candidate : s)));

  drag.el.style.left = `${c * 10}%`;
  drag.el.style.top = `${r * 10}%`;
  drag.el.classList.toggle('invalid', !drag.ok);
}

function endDrag() {
  window.removeEventListener('pointermove', onDragMove);
  if (!drag) return;

  const { el, index, layout, moved, candidate, ok } = drag;
  el.classList.remove('dragging', 'invalid');
  drag = null;

  // A press that never moved is a rotate, not a move.
  if (!moved) return rotateShip(index, layout);
  if (!ok || !candidate) return render(); // snap back to the server's truth

  commitLayout(layout.map((s, i) => (i === index ? candidate : s)));
}

function rotateShip(index, layout) {
  const ship = layout[index];
  const flipped = { ...ship, horizontal: !ship.horizontal };
  flipped.r = clamp(flipped.r, SIZE - (flipped.horizontal ? 1 : flipped.size));
  flipped.c = clamp(flipped.c, SIZE - (flipped.horizontal ? flipped.size : 1));

  const next = layout.map((s, i) => (i === index ? flipped : s));
  if (!layoutValid(next)) {
    S.error = `The ${ship.name} has no room to turn there.`;
    return render();
  }
  commitLayout(next);
}

// Propose, don't apply: the board we draw is whatever the server sends back.
function commitLayout(layout) {
  send({
    type: 'place',
    ships: layout.map(({ name, r, c, horizontal }) => ({ name, r, c, horizontal })),
  });
}

function render() {
  $('codeBadge').textContent = S.code;
  $('codeBadge').classList.remove('hidden');

  renderStatus();
  renderControls();
  renderOwn();
  renderEnemy();
  if (!$('modal').classList.contains('hidden')) renderRematchNote();
}

function renderStatus() {
  const el = $('status');
  el.className = 'status';
  let main = '';
  let sub = '';

  if (S.error) {
    el.classList.add('bad');
    main = S.error;
  } else if (S.over) {
    const won = S.winner === S.slot;
    main = won ? '<b>You win.</b> Every enemy ship is on the bottom.' : 'You lose. Your fleet is gone.';
    sub = 'Both fleets are revealed below.';
  } else if (S.phase === 'lobby' || !S.opponent.joined) {
    el.classList.add('alert');
    main = 'Waiting for an opponent…';
    sub = `Share code <b>${S.code}</b> or the invite link.`;
  } else if (!S.opponent.present) {
    el.classList.add('alert');
    main = 'Opponent reconnecting…';
    sub = 'The game is paused. Their state is safe on the server.';
  } else if (S.phase === 'placing') {
    main = S.ready ? 'Fleet locked in.' : 'Arrange your fleet, then hit Ready.';
    sub = S.ready
      ? 'Waiting for your opponent to lock in.'
      : 'Drag a ship to move it, click it to rotate — or randomize.'
        + (S.opponent.ready ? ' Your opponent is ready and waiting.' : '');
  } else if (S.phase === 'playing' && S.yourTurn) {
    if (S.streak?.hit) el.classList.add('hot');
    main = S.streak?.hit ? '<b>Hit — fire again.</b>' : '<b>Your turn.</b> Pick a target.';
    sub = S.streak?.sunk
      ? `You sank their ${S.streak.shipName}. A hit earns another shot.`
      : 'Click a cell in enemy waters.';
  } else if (S.phase === 'playing') {
    main = 'Their turn…';
    sub = S.theirStreak?.sunk
      ? `They sank your ${S.theirStreak.shipName} and fire again.`
      : S.theirStreak?.hit
        ? 'They hit, so they fire again.'
        : 'Waiting for their shot.';
  }

  el.innerHTML = main + (sub ? `<span class="sub">${sub}</span>` : '');
}

function renderControls() {
  const placing = S.phase === 'placing' && !S.over;
  $('randomBtn').classList.toggle('hidden', !placing);
  $('readyBtn').classList.toggle('hidden', !placing);
  $('randomBtn').disabled = S.ready;
  $('readyBtn').disabled = S.ready;
  $('readyBtn').textContent = S.ready ? 'Ready ✓' : 'Ready';
  // Closing the modal shouldn't be a dead end.
  $('resultBtn').classList.toggle('hidden', !S.over);
}

// --- impact effects --------------------------------------------------------

// Appended to the cell rather than driven by a class, so it survives the next
// render() pass and cleans itself up.
function impact(host, r, c, hit) {
  const cell = host.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (!cell) return;

  const fx = document.createElement('span');
  fx.className = 'fx';
  if (hit) {
    const sparks = [0, 48, 96, 144, 192, 240, 288, 330]
      .map((a) => `<span class="spark" style="--a:${a}deg;--d:${16 + Math.round(Math.random() * 16)}px"></span>`)
      .join('');
    fx.innerHTML = `<span class="smoke"></span><span class="core"></span><span class="ring"></span>${sparks}`;
  } else {
    fx.innerHTML = '<span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>';
  }

  cell.append(fx);
  setTimeout(() => fx.remove(), 1300);
}

function shake(el) {
  el.classList.remove('shake');
  void el.offsetWidth; // restart the animation if two hits land in a row
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 460);
}

// --- end-of-game modal -----------------------------------------------------

function openModal() {
  const won = S.winner === S.slot;
  const shots = S.tracking.flat().filter((v) => v !== null).length;
  const hits = S.tracking.flat().filter((v) => v === 'hit').length;

  $('modalBox').className = `modal ${won ? 'win' : 'lose'}`;
  $('verdict').textContent = won ? 'Victory' : 'Defeat';
  $('verdictLine').textContent = won
    ? 'Every enemy ship is on the bottom.'
    : 'Your fleet has been sunk.';
  $('statShots').textContent = shots;
  $('statHits').textContent = hits;
  $('statAcc').textContent = shots ? `${Math.round((hits / shots) * 100)}%` : '0%';

  renderRematchNote();
  $('modal').classList.remove('hidden');
}

function closeModal() {
  $('modal').classList.add('hidden');
}

function renderRematchNote() {
  const note = $('rematchNote');
  const button = $('againBtn');

  if (S.rematchAsked) {
    note.textContent = S.rematchOffered ? 'Starting a new game…' : 'Waiting for your opponent…';
    button.disabled = true;
    button.textContent = 'Play again ✓';
  } else if (S.rematchOffered) {
    note.textContent = 'Your opponent wants a rematch.';
    button.disabled = false;
    button.textContent = 'Accept rematch';
  } else {
    note.textContent = S.opponent.present ? '' : 'Your opponent has disconnected.';
    button.disabled = false;
    button.textContent = 'Play again';
  }
}

function renderOwn() {
  $('ownCase').classList.toggle('live', S.phase === 'playing' && !S.yourTurn && !S.over);
  // Don't rebuild hulls mid-drag; it would yank the element out from under the
  // pointer if a message happens to land.
  if (!drag) drawShips($('ownGrid'), S.ships, false, S.phase === 'placing' && !S.ready);

  cellsOf($('ownGrid')).forEach((cell) => {
    const r = +cell.dataset.r;
    const c = +cell.dataset.c;
    const shipIndex = S.grid ? S.grid[r][c] : -1;

    cell.className = 'cell';
    // Kept as a semantic marker even though the hull layer does the drawing.
    if (shipIndex >= 0) cell.classList.add('ship');
    if (S.shot[r][c]) cell.classList.add(shipIndex >= 0 ? 'hit' : 'miss');
    if (S.lastOwn && S.lastOwn[0] === r && S.lastOwn[1] === c) cell.classList.add('last');
  });

  $('ownFleet').replaceChildren(...S.ships.map((s) => chip(s.name, s.size, s.sunk)));
}

function renderEnemy() {
  const canFire = S.phase === 'playing' && S.yourTurn && !S.over;
  $('enemyCase').classList.toggle('live', canFire);
  $('enemyTitle').textContent = S.over ? 'Enemy fleet (revealed)' : 'Enemy waters';

  // Hulls appear here only once the server has revealed them at game over.
  drawShips($('enemyGrid'), S.reveal ? S.reveal.ships : null, true);

  cellsOf($('enemyGrid')).forEach((cell) => {
    const r = +cell.dataset.r;
    const c = +cell.dataset.c;
    const mark = S.tracking[r][c];

    cell.className = 'cell';
    if (mark === 'hit') cell.classList.add('hit');
    if (mark === 'miss') cell.classList.add('miss');
    if (canFire && !mark) cell.classList.add('aim');
    if (S.lastEnemy && S.lastEnemy[0] === r && S.lastEnemy[1] === c) cell.classList.add('last');
  });

  const enemyShips = S.reveal ? S.reveal.ships : null;
  $('enemyFleet').replaceChildren(
    ...(enemyShips
      ? enemyShips.map((s) => chip(s.name, s.size, s.sunk))
      : S.enemySunk.map((name) => chip(name, null, true))),
  );
}

function chip(name, size, sunk) {
  const el = document.createElement('span');
  el.className = 'chip' + (sunk ? ' sunk' : '');

  if (size) {
    const bar = document.createElement('span');
    bar.className = 'silhouette';
    bar.style.width = `${size * 0.3}rem`;
    el.append(bar);
  }

  const text = document.createElement('span');
  text.className = 'name';
  text.textContent = name;
  el.append(text);
  return el;
}

// --- actions ---------------------------------------------------------------

function randomCode() {
  let code = '';
  for (let i = 0; i < 4; i++) code += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return code;
}

function enterRoom(code) {
  leaving = false;
  resetState(code);
  location.hash = code;
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  buildGrid($('ownGrid'), null);
  buildGrid($('enemyGrid'), fire);
  render();
  connect();
}

function fire(r, c) {
  if (S.phase !== 'playing' || !S.yourTurn || S.over || S.tracking[r][c]) return;
  send({ type: 'fire', r, c });
}

$('createBtn').addEventListener('click', () => enterRoom(randomCode()));

$('joinBtn').addEventListener('click', () => {
  const code = $('codeInput').value.trim().toUpperCase();
  if (code) enterRoom(code);
});

$('codeInput').addEventListener('keydown', (e) => e.key === 'Enter' && $('joinBtn').click());

$('randomBtn').addEventListener('click', () => send({ type: 'randomize' }));
$('readyBtn').addEventListener('click', () => send({ type: 'ready' }));

$('againBtn').addEventListener('click', () => {
  send({ type: 'rematch' });
  S.rematchAsked = true;
  renderRematchNote();
});
$('closeBtn').addEventListener('click', closeModal);
$('resultBtn').addEventListener('click', openModal);

$('shareBtn').addEventListener('click', async () => {
  const link = `${location.origin}/#${S.code}`;
  try {
    await navigator.clipboard.writeText(link);
    $('shareBtn').textContent = 'Copied ✓';
  } catch {
    // Clipboard is blocked outside a secure context — show the link instead.
    $('shareBtn').textContent = link;
  }
  setTimeout(() => ($('shareBtn').textContent = 'Copy invite link'), 2500);
});

$('leaveBtn').addEventListener('click', () => {
  leaving = true;
  // Drop the token too, or the reload would just walk straight back in.
  identity.clear(S.code);
  if (ws) ws.close();
  location.hash = '';
  location.reload();
});

// Deep link: /#K7QF drops you straight into a room.
const fromHash = location.hash.replace('#', '').trim().toUpperCase();
if (fromHash) {
  $('codeInput').value = fromHash;
  enterRoom(fromHash);
}
</script>
</body>
</html>
